# gpg-agent configuration for the Heads initrd.
#
# enable-ssh-support exposes gpg-agent's SSH agent socket (SSH_AUTH_SOCK) so the
# OpenSSH client (modules/openssh) can use GPG keys held on the security dongle
# for wyng-backup's ssh transport.  The socket path is exported by
# initrd/etc/functions.sh:setup_gpg_agent_ssh_socket (called from initrd/init);
# the TTLs bound how long the agent caches the SSH key passphrase.
scdaemon-program /bin/scdaemon
pinentry-program /bin/pinentry-tty
allow-loopback-pinentry
daemon
enable-ssh-support
default-cache-ttl-ssh 1800
max-cache-ttl-ssh 7200
